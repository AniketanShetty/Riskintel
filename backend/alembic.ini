# RiskIntel — Alembic Configuration
# Pointed at the backend/ package context.
# See alembic/env.py for the migration environment.

[alembic]
script_location = alembic
prepend_sys_path = .

# The sqlalchemy.url is overridden at runtime by app.core.config.settings
# in alembic/env.py, but a placeholder is provided for reference.
sqlalchemy.url = sqlite:///riskintel.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
